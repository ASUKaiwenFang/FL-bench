# DP-SCAFFOLD Last Noise Variant Configuration
# This configuration uses parameter-level noise addition (last_noise) with SCAFFOLD control variates

defaults:
  - defaults
  - _self_

# Override Hydra output directory to use 'out' instead of 'outputs'
hydra:
  run:
    dir: ../../out/${method}/${dataset.name}/${now:%Y-%m-%d-%H-%M-%S}

# Override method to use DP-SCAFFOLD
method: dp_scaffold


# Model settings
model:
  name: 2nn

# Training settings
common:
  seed: 42
  join_ratio: 0.1
  global_epoch: 100
  local_epoch: 5
  batch_size: 32
  test:
    server:
      interval: 1
      train: false
      val: false
      test: true
      # Whether to evaluate the global model in train mode or eval mode.
      # Evaluating in train mode allows to get better batchnorm statistics, but is dependent on the order of the data.
      model_in_train_mode: false

# DP-SCAFFOLD specific parameters - Last Noise Variant
dp_scaffold:
  algorithm_variant: "last_noise"  # Parameter-level noise addition
  clip_norm: 1.0                   # Gradient clipping threshold
  sigma: 1                   # Noise standard deviation parameter
  global_lr: 1.0                   # SCAFFOLD global learning rate

# Optimizer settings
optimizer:
  name: sgd
  lr: 0.01