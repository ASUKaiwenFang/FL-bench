# DP-FedStein Step Noise Step JSE Variant Configuration
# This configuration uses gradient-level noise addition with per-step JSE shrinkage

defaults:
  - defaults
  - _self_

# Override Hydra output directory to use 'out' instead of 'outputs'
hydra:
  run:
    dir: ../../out/${method}/${dataset.name}/${now:%Y-%m-%d-%H-%M-%S}

# Override method to use DP-FedStein
method: dp_fed_stein

# Model settings
model:
  name: 2nn

# Training settings
common:
  seed: 42
  join_ratio: 0.2
  global_epoch: 10
  local_epoch: 5
  batch_size: 32
  monitor: tensorboard

# DP-FedStein specific parameters - Step Noise Step JSE Variant
dp_fed_stein:
  algorithm_variant: "step_noise_step_jse"  # Gradient-level noise + per-step JSE
  clip_method: "global"            # Clipping method: global, heuristic, per_layer
  jse_method: "per_layer"
  clip_norm: 10.0                            # Gradient clipping threshold
  sigma: 3.0                                # Noise standard deviation parameter
  data_sample_ratio: 0.2                   # Data sampling ratio (0.2 = 20% of trainset)

optimizer:
  name: sgd # [sgd, adam, adamw, rmsprop, adagrad]
  lr: 10.0

dataset:
  # [mnist, cifar10, cifar100, emnist, fmnist, femnist, medmnist,
  # medmnistA, medmnistC, covid19, celeba, synthetic, svhn,
  # tiny_imagenet, cinic10, domain]
  name: mnist