# Balanced configuration (ε ≈ 4.79)
# Balance between privacy protection and model performance

defaults:
  - defaults
  - _self_

hydra:
  run:
    dir: ../../out/${method}/${dataset.name}/${now:%Y-%m-%d-%H-%M-%S}

method: dp_fedavg_local

model:
  name: 2nn

dataset:
  name: mnist

common:
  seed: 42
  join_ratio: 0.1        # 10% users participate per round
  global_epoch: 100      # 100 communication rounds
  local_epoch: 5         # 5 local updates per round
  batch_size: 32

# Balanced configuration: moderate noise
dp_fedavg_local:
  algorithm_variant: "step_noise"
  clip_norm: 1.0         # Gradient clipping
  sigma: 1               # Moderate noise → ε ≈ 4.79

optimizer:
  name: sgd
  lr: 0.01