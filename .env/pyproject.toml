[project]
name = "fl-bench"
version = "0.2.0"
description = "Benchmark of federated learning that aim solving image classification tasks."
authors = [
    {name = "KarhouTam", email = "karhoutam@qq.com"},
    {name = "Xinpeng Wang", email = "223015056@link.cuhk.edu.cn"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "rich>=13.9.4",
    "pandas>=2.2.3",
    "visdom>=0.2.4",
    "Pillow>=11.1.0",
    "scipy>=1.15.2",
    "matplotlib>=3.10.3",
    "scikit-learn>=1.7.0",
    "faiss-cpu>=1.9.0",
    "pynvml>=12.0.0",
    "PyYAML>=6.0.2",
    "ray[default]>=2.49.2",
    "tensorboard>=2.17.1",
    "cvxpy>=1.7.3",
    "hydra-core>=1.3.2",
    "flwr-datasets>=0.5.0",
    "statsmodels>=0.14.4",
    "pytorch-minimize>=0.0.2",
]

[project.urls]
Repository = "https://github.com/KarhouTam/FL-bench"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
