# DP-SCAFFOLD Last Noise Variant Configuration
# This configuration uses parameter-level noise addition (last_noise) with SCAFFOLD control variates

defaults:
  - defaults
  - _self_

# Override Hydra output directory to use 'out' instead of 'outputs'
hydra:
  run:
    dir: ../../out/${method}/${dataset.name}/${now:%Y-%m-%d-%H-%M-%S}

# Override method to use DP-SCAFFOLD
method: dp_scaffold


# Model settings
model:
  name: 2nn

# Training settings
common:
  seed: 42
  join_ratio: 0.2
  global_epoch: 100
  local_epoch: 50
  batch_size: 32
  monitor: tensorboard


# DP-SCAFFOLD specific parameters - Last Noise Variant
dp_scaffold:
  algorithm_variant: "last_noise"  # Parameter-level noise addition
  clip_method: "global"            # Clipping method: global, heuristic, per_layer
  clip_norm: 1.0                   # Gradient clipping threshold
  sigma: 30                        # Noise standard deviation parameter
  data_sample_ratio: 0.2           # Data sampling ratio (0.2 = 20% of trainset)
  global_lr: 1.0                   # SCAFFOLD global learning rate

# Optimizer settings
optimizer:
  name: sgd
  lr: 0.001